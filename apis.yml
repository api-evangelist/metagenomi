aid: metagenomi
name: Metagenomi
description: >-
  Metagenomi Therapeutics, Inc. (Nasdaq: MGX) is an Emeryville, California clinical-stage
  genetic medicines company that mines metagenomics — DNA sequenced directly from
  environmental microbial communities — together with machine learning to discover novel
  gene-editing machinery from otherwise unknown organisms, then engineers it into in vivo
  genome-editing therapies. Its published toolbox spans five system classes: programmable
  CRISPR nucleases, ultra-small nucleases that package into a single AAV vector, base
  editors the company describes as "the smallest CRISPR base editors known", RNA Mediated
  Integration Systems (RIGS) for template-encoded edits, and CRISPR Associated Transposases
  (CASTs) for gene integrations exceeding 10,000 base pairs. The company completed its
  initial public offering on the Nasdaq Global Select Market in February 2024 at $15.00 per
  share and partners with Ionis Pharmaceuticals on gene-editing programs including ApoC-III,
  transthyretin (TTR) and angiotensinogen (AGT). Metagenomi sells therapeutics, not
  software: metagenomi.co is a seven-page Craft CMS marketing site with no developer
  program, no API, no SDK and no machine-readable specification of any kind. Its GitHub
  organization is real and first-party but publishes zero public repositories, and its only
  first-party software package — the `metagenomi` PyPI library of internal Docker helper
  scripts — has not shipped a release since July 2019.
